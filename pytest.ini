[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
# Escalate warnings in stages: for now only surface DeprecationWarning by
# default. Do not use `error` here — it would fail the suite. Add stricter
# per-category rules below only as each warning class is actually fixed.
filterwarnings =
    default::DeprecationWarning
