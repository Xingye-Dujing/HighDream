<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Matrix Lab</title>
    <link rel="stylesheet" href="../static/fontawesome/css/all.min.css"/>
    <link rel="stylesheet" href="/static/style.css"/>
    <link rel="stylesheet" href="/static/matrix_lab.css"/>
    <link rel="stylesheet" href="/static/hd-theme.css"/>
    <link rel="stylesheet" href="/static/hd-select.css"/>
    <link rel="stylesheet" href="/static/mathlive/mathlive-fonts.css"/>
    <script
            id="MathJax-script"
            async
            src="../static/mathjax/es5/tex-chtml-full.js"
    ></script>
    <script src="/static/mathlive/mathlive.min.js"></script>
    <script src="/static/matrix_lab.js"></script>
</head>

<body>
<div id="math-background">
    <div class="math-bg-element" style="top: 10%; left: 5%">∫</div>
    <div class="math-bg-element" style="top: 20%; right: 8%">∑</div>
    <div class="math-bg-element" style="top: 40%; left: 7%">∂</div>
    <div class="math-bg-element" style="top: 60%; right: 10%">π</div>
    <div class="math-bg-element" style="top: 80%; left: 12%">∞</div>
    <div class="math-bg-element" style="bottom: 15%; right: 5%">∇</div>
</div>

<!-- Page actions. There is no per-page title bar and no wrapper
     div: /static/hd-menu.js moves these buttons into the product
     menu bar. `hidden` keeps them out of the layout until then,
     and their ids stay resolvable for the page scripts. -->
<button class="header-btn" data-hd-action hidden id="saveNotebookBtn" title="保存笔记本"> <i class="fas fa-save"></i> </button> 
<button class="header-btn" data-hd-action hidden id="loadNotebookBtn" title="加载笔记本"> <i class="fas fa-folder-open"></i> </button> 
<div id="toolbar">
    <button class="toolbar-button" id="addCellBtn">
        <i class="fas fa-plus"></i><span>添加计算单元格</span>
    </button>
    <button class="toolbar-button" id="addMdCellBtn">
        <i class="fas fa-plus"></i><span>添加文本单元格</span>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-button" id="moveCellUpBtn">
        <i class="fas fa-arrow-up"></i><span>上移</span>
    </button>
    <button class="toolbar-button" id="moveCellDownBtn">
        <i class="fas fa-arrow-down"></i><span>下移</span>
    </button>
    <button class="toolbar-button" id="deleteCellBtn">
        <i class="fas fa-trash"></i><span>删除</span>
    </button>
</div>

<div id="main-cols">
    <div id="main-pane">
        <div id="content">
            <form id="matrix-lab-start" class="hd-universal-bar" method="get" action="/matrix_lab">
                <textarea class="hd-universal-source" data-universal-input
                          placeholder="输入初始矩阵，例如 [[1,2],[3,4]]">{{ expression or '' }}</textarea>
                <button type="submit" class="hd-universal-run"><i class="fas fa-play"></i><span>载入矩阵</span></button>
            </form>
            {% if matrix_error %}
            <div class="preview-error">{{ matrix_error }}</div>
            {% endif %}
            {% if expression %}
            <div id="matrix-render" class="result-section">
                <div class="matrix-preview">
                    <!-- This p tag is invisible and is used to pass the expression string -->
                    <p style="display: none">{{expression}}</p>
                    <div class="render"></div>
                </div>
            </div>
            {% endif %}
        </div>

        <div id="notebook-container">
            <div id="notebook">
                <!-- Initial cells will be dynamically generated by JavaScript -->
            </div>
        </div>
    </div>

    <div id="math-keyboard" aria-label="矩阵实验操作 / 模板工具">
        <div class="keyboard-content">
            <div class="keyboard-group-label">矩阵操作</div>
            <div class="keyboard-row">
                <button class="keyboard-key" data-latex="\mathrm{transpose}" data-insert="\mathrm{transpose}">转置</button>
                <button class="keyboard-key" data-latex="\mathrm{inverse}" data-insert="\mathrm{inverse}">求逆</button>
                <button class="keyboard-key" data-latex="\mathrm{rref}" data-insert="\mathrm{rref}">行最简</button>
                <button class="keyboard-key" data-latex="\det" data-insert="\mathrm{det}">行列式</button>
                <button class="keyboard-key" data-latex="\mathrm{rank}" data-insert="\mathrm{rank}">秩</button>
                <button class="keyboard-key" data-latex="\mathrm{trace}" data-insert="\mathrm{trace}">迹</button>
            </div>
            <div class="keyboard-group-label">行 / 列操作</div>
            <div class="keyboard-row">
                <button class="keyboard-key" data-latex="\mathrm{swap\_rows}(0,1)" data-insert="\mathrm{swap\_rows}(0,1)">交换行</button>
                <button class="keyboard-key" data-latex="\mathrm{add\_rows}(0,1,1)" data-insert="\mathrm{add\_rows}(0,1,1)">行相加</button>
                <button class="keyboard-key" data-latex="\mathrm{scale\_row}(0,2)" data-insert="\mathrm{scale\_row}(0,2)">缩放行</button>
                <button class="keyboard-key" data-latex="\mathrm{swap\_cols}(0,1)" data-insert="\mathrm{swap\_cols}(0,1)">交换列</button>
                <button class="keyboard-key" data-latex="\mathrm{add\_cols}(0,1,1)" data-insert="\mathrm{add\_cols}(0,1,1)">列相加</button>
                <button class="keyboard-key" data-latex="\mathrm{scale\_col}(0,2)" data-insert="\mathrm{scale\_col}(0,2)">缩放列</button>
                <button class="keyboard-key" data-latex="\mathrm{remove\_row}(0)" data-insert="\mathrm{remove\_row}(0)">删除行</button>
                <button class="keyboard-key" data-latex="\mathrm{remove\_col}(0)" data-insert="\mathrm{remove\_col}(0)">删除列</button>
                <button class="keyboard-key" data-latex="\mathrm{submatrix}(0,1,0,1)" data-insert="\mathrm{submatrix}(0,1,0,1)">子矩阵</button>
            </div>
            <div class="keyboard-group-label">矩阵运算</div>
            <div class="keyboard-row">
                <button class="keyboard-key" data-latex="\mathrm{scale}(2)" data-insert="\mathrm{scale}(2)">数乘</button>
                <button class="keyboard-key" data-latex="\mathrm{power}(2)" data-insert="\mathrm{power}(2)">幂</button>
                <button class="keyboard-key" data-latex="\mathrm{add}\left(\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}\right)" data-insert="\mathrm{add}\left(\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}\right)">加矩阵</button>
                <button class="keyboard-key" data-latex="\mathrm{subtract}\left(\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}\right)" data-insert="\mathrm{subtract}\left(\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}\right)">减矩阵</button>
                <button class="keyboard-key" data-latex="\mathrm{multiply}\left(\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}\right)" data-insert="\mathrm{multiply}\left(\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}\right)">乘矩阵</button>
            </div>
        </div>
    </div>
</div>

<!-- Full-screen overlay -->
<div class="math-fullscreen-overlay">
    <div class="math-fullscreen-content">
        <div class="math-fullscreen-header">
            <button class="math-fullscreen-close" title="关闭">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="math-fullscreen-body"></div>
    </div>
</div>

<script src="/static/hd-universal-input.js"></script>
<script src="/static/hd-menu.js"></script>
<script src="/static/hd-select.js"></script>
</body>
</html>
