<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HighDream Notebook</title>
    <link rel="stylesheet" href="../static/fontawesome/css/all.min.css"/>
    <link rel="stylesheet" href="/static/style.css"/>
    <link rel="stylesheet" href="/static/mathlive/mathlive-fonts.css"/>
    <link rel="stylesheet" href="/static/hd-theme.css"/>
    <link rel="stylesheet" href="/static/hd-select.css"/>
    <script
            id="MathJax-script"
            async
            src="../static/mathjax/es5/tex-chtml-full.js"
    ></script>
    <script src="/static/mathlive/mathlive.min.js"></script>
    <script>
        // Point MathLive's KaTeX @font-face URLs at the locally-vendored fonts so the
        // WYSIWYG editor renders fully offline (no CDN dependency).
        window.addEventListener('DOMContentLoaded', function () {
            if (window.MathLive && typeof window.MathLive.setFonts === 'function') {
                try { window.MathLive.setFonts('/static/mathlive/fonts/'); } catch (e) { /* ignore */ }
            }
        });
    </script>
    <script src="/static/script.js"></script>
</head>

<body>
<div id="math-background">
    <div class="math-bg-element" style="top: 10%; left: 5%">∫</div>
    <div class="math-bg-element" style="top: 20%; right: 8%">∑</div>
    <div class="math-bg-element" style="top: 40%; left: 7%">∂</div>
    <div class="math-bg-element" style="top: 60%; right: 10%">π</div>
    <div class="math-bg-element" style="top: 80%; left: 12%">∞</div>
    <div class="math-bg-element" style="bottom: 15%; right: 5%">∇</div>
</div>

<!-- Page actions. There is no per-page title bar and no wrapper
     div: /static/hd-menu.js moves these buttons into the product
     menu bar. `hidden` keeps them out of the layout until then,
     and their ids stay resolvable for the page scripts. -->
<button class="header-btn" data-hd-action hidden id="saveNotebookBtn" title="保存笔记本 (JSON)"> <i class="fas fa-save"></i> </button> 
<button class="header-btn" data-hd-action hidden id="loadNotebookBtn" title="加载笔记本"> <i class="fas fa-folder-open"></i> </button> 
<button class="header-btn" data-hd-action hidden id="exportMdBtn" title="导出为 Markdown"> <i class="fas fa-file-alt"></i> </button> 
<button class="header-btn" data-hd-action hidden id="exportTexBtn" title="导出为 LaTeX (XeLaTeX)"> <i class="fas fa-file-code"></i> </button> 
<button class="header-btn" data-hd-action hidden id="exportPdfBtn" title="导出为 PDF"> <i class="fas fa-file-pdf"></i> </button>
    <!--
    -->

<div id="toolbar">
    <button class="toolbar-button" id="addCellBtn">
        <i class="fas fa-plus"></i><span>添加计算单元格</span>
    </button>
    <button class="toolbar-button" id="addMdCellBtn">
        <i class="fas fa-plus"></i><span>添加文本单元格</span>
    </button>
    <button class="toolbar-button" id="runAllBtn">
        <i class="fas fa-play"></i><span>运行所有</span>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-button" id="moveCellUpBtn">
        <i class="fas fa-arrow-up"></i><span>上移</span>
    </button>
    <button class="toolbar-button" id="moveCellDownBtn">
        <i class="fas fa-arrow-down"></i><span>下移</span>
    </button>
    <button class="toolbar-button" id="deleteCellBtn">
        <i class="fas fa-trash"></i><span>删除</span>
    </button>
    <button class="toolbar-button" id="toggleCodeCellInputs">
        <i class="fas fa-circle-nodes"></i><span>切换可见性</span>
    </button>
    <div style="flex-grow: 1"></div>
    <div id="kernel-status">
        <i class="fas fa-circle"></i>
        <span>内核就绪</span>
    </div>
</div>

<div id="main-cols">
<div id="notebook-container">
    <div id="notebook">
        <!-- JavaScript will dynamically generate initial cells -->
    </div>
</div>

{% raw %}
<div id="math-keyboard">
    <div class="keyboard-header">
        <span>数学符号 / 模板工具</span>
    </div>
    <div class="keyboard-content">
        <div class="keyboard-group-label">数字</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="0">0</button>
            <button class="keyboard-key" data-latex="1">1</button>
            <button class="keyboard-key" data-latex="2">2</button>
            <button class="keyboard-key" data-latex="3">3</button>
            <button class="keyboard-key" data-latex="4">4</button>
            <button class="keyboard-key" data-latex="5">5</button>
            <button class="keyboard-key" data-latex="6">6</button>
            <button class="keyboard-key" data-latex="7">7</button>
            <button class="keyboard-key" data-latex="8">8</button>
            <button class="keyboard-key" data-latex="9">9</button>
        </div>
        <div class="keyboard-group-label">运算符 / 括号</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="+">+</button>
            <button class="keyboard-key" data-latex="-">−</button>
            <button class="keyboard-key" data-latex="\cdot">×</button>
            <button class="keyboard-key" data-latex="\div">÷</button>
            <button class="keyboard-key" data-latex="^{\placeholder{}}">xⁿ</button>
            <button class="keyboard-key" data-latex="_{\placeholder{}}">xᵢ</button>
            <button class="keyboard-key" data-latex="(">(</button>
            <button class="keyboard-key" data-latex=")">)</button>
            <button class="keyboard-key" data-latex="\left[\placeholder{}\right]">[ ]</button>
        </div>
        <div class="keyboard-group-label">变量 / 常数</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="x">x</button>
            <button class="keyboard-key" data-latex="y">y</button>
            <button class="keyboard-key" data-latex="z">z</button>
            <button class="keyboard-key" data-latex="n">n</button>
            <button class="keyboard-key" data-latex="t">t</button>
            <button class="keyboard-key" data-latex="a">a</button>
            <button class="keyboard-key" data-latex="b">b</button>
            <button class="keyboard-key" data-latex="c">c</button>
            <button class="keyboard-key" data-latex="\pi">π</button>
            <button class="keyboard-key" data-latex="\theta">θ</button>
            <button class="keyboard-key" data-latex="\infty">∞</button>
        </div>
        <div class="keyboard-group-label">结构模板</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="\frac{\placeholder{}}{\placeholder{}}">分数</button>
            <button class="keyboard-key" data-latex="\sqrt{\placeholder{}}">根号</button>
            <button class="keyboard-key" data-latex="\sqrt[\placeholder{}]{\placeholder{}}">n次根</button>
            <button class="keyboard-key" data-latex="\frac{d}{d\placeholder{}}(\placeholder{})">导数</button>
            <button class="keyboard-key" data-latex="\partial_{\placeholder{}}(\placeholder{})">偏导</button>
            <button class="keyboard-key" data-latex="\begin{bmatrix}\placeholder{}&amp;\placeholder{}\\\placeholder{}&amp;\placeholder{}\end{bmatrix}">矩阵</button>
        </div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="\int_{\placeholder{}}^{\placeholder{}}(\placeholder{})\, d\placeholder{}">定积分</button>
            <button class="keyboard-key" data-latex="\int (\placeholder{})\, d\placeholder{}">积分</button>
            <button class="keyboard-key" data-latex="\sum_{\placeholder{}}^{\placeholder{}}(\placeholder{})">求和</button>
            <button class="keyboard-key" data-latex="\prod_{\placeholder{}}^{\placeholder{}}(\placeholder{})">求积</button>
            <button class="keyboard-key" data-latex="\lim_{\placeholder{} \to \placeholder{}}(\placeholder{})">极限</button>
        </div>
        <div class="keyboard-group-label">函数</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="\sin(\placeholder{})">sin</button>
            <button class="keyboard-key" data-latex="\cos(\placeholder{})">cos</button>
            <button class="keyboard-key" data-latex="\tan(\placeholder{})">tan</button>
            <button class="keyboard-key" data-latex="\ln(\placeholder{})">ln</button>
            <button class="keyboard-key" data-latex="\log_{\placeholder{}}(\placeholder{})">log</button>
            <button class="keyboard-key" data-latex="\exp(\placeholder{})">exp</button>
            <button class="keyboard-key" data-latex="e^{\placeholder{}}">eˣ</button>
        </div>
        <div class="keyboard-group-label">表达式化简</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="simplify(\placeholder{})">等价表达式</button>
            <button class="keyboard-key" data-latex="msimplify(\placeholder{})">符号矩阵化简</button>
        </div>
        <div class="keyboard-group-label">单变量微积分</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="diff(\placeholder{},\placeholder{})">求导</button>
            <button class="keyboard-key" data-latex="int(\placeholder{},\placeholder{})">不定积分</button>
            <button class="keyboard-key" data-latex="int(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">定积分</button>
            <button class="keyboard-key" data-latex="limit(\placeholder{},\placeholder{},\placeholder{})">极限</button>
            <button class="keyboard-key" data-latex="improper(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">反常积分</button>
            <button class="keyboard-key" data-latex="taylor(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">泰勒展开</button>
            <button class="keyboard-key" data-latex="taylorerror(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">泰勒余项</button>
        </div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="tangent(\placeholder{},\placeholder{},\placeholder{})">切线方程</button>
            <button class="keyboard-key" data-latex="linearization(\placeholder{},\placeholder{},\placeholder{})">线性化</button>
            <button class="keyboard-key" data-latex="critical(\placeholder{},\placeholder{})">临界点/极值</button>
            <button class="keyboard-key" data-latex="newton(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">牛顿法</button>
            <button class="keyboard-key" data-latex="meanvalue(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">中值定理</button>
        </div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="arclength(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">弧长</button>
            <button class="keyboard-key" data-latex="volume(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">体积(圆盘)</button>
            <button class="keyboard-key" data-latex="shell(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">体积(柱壳)</button>
            <button class="keyboard-key" data-latex="surface(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">曲面面积</button>
        </div>
        <div class="keyboard-group-label">多变量微积分</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="diff(\placeholder{},\placeholder{})">偏导数</button>
            <button class="keyboard-key" data-latex="iterated(\placeholder{},\placeholder{},\placeholder{},\placeholder{},\placeholder{},\placeholder{},\placeholder{})">二重积分</button>
            <button class="keyboard-key" data-latex="implicit(\placeholder{},\placeholder{})">隐函数求导</button>
            <button class="keyboard-key" data-latex="parametric(\placeholder{},\placeholder{})">参数方程求导</button>
            <button class="keyboard-key" data-latex="polararea(\placeholder{},\placeholder{},\placeholder{},\placeholder{})">极坐标面积</button>
            <button class="keyboard-key" data-latex="polarslope(\placeholder{},\placeholder{})">极坐标斜率</button>
        </div>
        <div class="keyboard-group-label">级数</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="sum(\placeholder{},\placeholder{})">级数敛散性</button>
            <button class="keyboard-key" data-latex="radius(\placeholder{},\placeholder{})">收敛半径</button>
            <button class="keyboard-key" data-latex="powerseries(\placeholder{},\placeholder{},\placeholder{})">幂级数收敛域</button>
        </div>
        <div class="keyboard-group-label">常微分方程</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="ode(\placeholder{},\placeholder{})">微分方程求解</button>
        </div>
        <div class="keyboard-group-label">数值方法</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="numerical(\placeholder{},\placeholder{},\placeholder{},\placeholder{},\placeholder{})">数值积分</button>
        </div>
        <div class="keyboard-group-label">复数</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="complex(\placeholder{})">复数化简</button>
            <button class="keyboard-key" data-latex="complexpolar(\placeholder{})">极坐标形式</button>
            <button class="keyboard-key" data-latex="complexroots(\placeholder{},\placeholder{})">复数求根</button>
            <button class="keyboard-key" data-latex="demoivre(\placeholder{},\placeholder{})">棣莫弗高次幂</button>
        </div>
        <div class="keyboard-group-label">线性代数 · 单矩阵</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="det(\placeholder{})">行列式</button>
            <button class="keyboard-key" data-latex="rank(\placeholder{})">秩</button>
            <button class="keyboard-key" data-latex="inverse(\placeholder{})">求逆</button>
            <button class="keyboard-key" data-latex="rref(\placeholder{})">行最简</button>
            <button class="keyboard-key" data-latex="eigen(\placeholder{})">特征值</button>
            <button class="keyboard-key" data-latex="svd(\placeholder{})">SVD</button>
        </div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="schur(\placeholder{})">Schur</button>
            <button class="keyboard-key" data-latex="lu(\placeholder{})">LU</button>
            <button class="keyboard-key" data-latex="diag(\placeholder{})">对角化</button>
            <button class="keyboard-key" data-latex="orthogonal(\placeholder{})">正交化</button>
            <button class="keyboard-key" data-latex="dependence(\placeholder{})">相关性</button>
            <button class="keyboard-key" data-latex="project(\placeholder{})">向量投影</button>
        </div>
        <div class="keyboard-group-label">线性代数 · 运算与方程组</div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-latex="add(\placeholder{},\placeholder{})">矩阵加法</button>
            <button class="keyboard-key" data-latex="subtract(\placeholder{},\placeholder{})">矩阵减法</button>
            <button class="keyboard-key" data-latex="multiply(\placeholder{},\placeholder{})">矩阵乘法</button>
        </div>
        <div class="keyboard-row">
            <button class="keyboard-key" data-op="linear-solver">解方程组 Ax=b</button>
            <button class="keyboard-key" data-op="linear-system">方程组转矩阵</button>
            <button class="keyboard-key" data-op="transform-1">基/坐标变换</button>
            <button class="keyboard-key" data-op="transform-2">线性变换变基</button>
        </div>
    </div>
</div>
{% endraw %}
</div>

<!-- Full-screen overlay -->
<div class="math-fullscreen-overlay">
    <div class="math-fullscreen-content">
        <div class="math-fullscreen-header">
            <button class="math-fullscreen-close" title="关闭">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="math-fullscreen-body"></div>
    </div>
</div>
<script src="/static/hd-menu.js"></script>
<script src="/static/hd-select.js"></script>
</body>
</html>
